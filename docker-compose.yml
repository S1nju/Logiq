services:
  bot:
    build:
      context: .
      dockerfile: DockerFile
    container_name: bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    network_mode: host
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
