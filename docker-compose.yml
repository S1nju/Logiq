services:
  bot:
    build:
      context: .
      dockerfile: DockerFile
    container_name: bot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
      lavalink:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mongodb_data:/data/db

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    network_mode: host
    environment:
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --header=\"Authorization: youshallnotpass\" --spider http://127.0.0.1:2333/version || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongodb_data:
