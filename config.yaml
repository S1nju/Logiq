api_keys:
  anthropic: ''
  openai: ''
  spotify_client_id: ''
  spotify_client_secret: ''
  youtube: ''
bot:
  activity: يتم الادارة
  activity_type: watching
  config_channel: 1494454599988281426
  language: en
  prefix: /
  status: online
  token: ${DISCORD_BOT_TOKEN}
database:
  database_name: Logiq
  mongodb_uri: ${MONGODB_URI}
  pool_size: 10
i18n:
  language: en
logging:
  date_format: '%Y-%m-%d %H:%M:%S'
  file: logs/bot.log
  format: '[%(asctime)s] [%(levelname)s] %(name)s: %(message)s'
  level: INFO
modules:
  ai_chat:
    api_key: ${DEEPSEEK_API_KEY}
    enabled: true
    max_tokens: 500
    model: deepseek-v4-flash
    provider: deepseek
    temperature: 0.7
  analytics:
    enabled: true
    report_channel: null
    report_interval: 604800
  economy:
    currency_name: RDMCoin
    currency_symbol: 💎
    daily_reward: 100
    enabled: true
    starting_balance: 1000
  games:
    betting_enabled: true
    enabled: true
  leveling:
    enabled: true
    voice_xp_rate: 5
    xp_cooldown: 60
    xp_per_message: 10
  moderation:
    auto_mod:
      max_emojis: 10
      max_mentions: 5
      spam_detection: true
      toxicity_filter: false
    enabled: true
    log_channel: null
  roles:
    enabled: true
    reaction_roles: true
    self_assign: true
  tickets:
    enabled: true
    support_role: null
    ticket_category: null
  verification:
    enabled: true
    verification_type: button
    verified_role: null
    welcome_channel: null
redis:
  db: 0
  enabled: false
  host: localhost
  password: null
  port: 6379
web:
  cors_origins:
  - http://localhost:3000
  - https://yourdomain.com
  enabled: true
  host: 0.0.0.0
  port: 8005
