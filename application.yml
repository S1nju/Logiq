server:
  port: 2333
  address: 0.0.0.0
lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.4.1"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "youshallnotpass"
    sources:
      youtube: false # Disable built-in YouTube plugin to use the external one for better block avoidance
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\"" # Search using standard ISRC from Spotify first
      - "ytsearch:%QUERY%"
    sources:
      spotify: true    # Enable Spotify support
      applemusic: true # Enable Apple Music support
      deezer: true     # Enable Deezer support
      yandexmusic: true
    spotify:
      clientId: "your_spotify_client_id_here" # (Optional) Fill these out if you get rate limited by Spotify
      clientSecret: "your_spotify_client_secret_here"

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
